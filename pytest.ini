[pytest]
testpaths = tests
# Three tiers, assigned by path in tests/conftest.py so the test modules stay
# plain unittest and `python -m unittest discover -s tests -t .` keeps
# working:
#   unit   -- nothing generated; hand-built grids and fakes. Every save.
#   world  -- the shared cached worlds (tests/worlds.py). Every change.
#   sweep  -- many seeds, statistical, minutes. Before a commit:
#             `python -m pytest -m sweep`
# The default invocation runs unit + world.
markers =
    unit: no world is generated
    world: reads the shared cached worlds in tests/worlds.py
    sweep: builds many seeds; statistical; run before a commit
addopts = -m "not sweep"
