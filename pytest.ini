[pytest]
testpaths = tests
# Four tiers, assigned by path in tests/conftest.py so the test modules stay
# plain unittest and `python -m unittest discover -s tests -t .` keeps
# working:
#   unit        -- nothing generated; hand-built grids and fakes. Every save:
#                  `python -m pytest -m unit`
#   world       -- the shared cached worlds (tests/worlds.py). Every change.
#   integration -- boots a real `Game` and drives its states. Slow.
#   sweep       -- many seeds, statistical, minutes. Before a commit:
#                  `python -m pytest -m sweep`
# The default invocation runs unit + world + integration.
#
# `unit` used to cover the integration modules too, which made the tier that is
# supposed to run on every save as slow as the whole suite.
markers =
    unit: no world is generated and no Game is booted
    world: reads the shared cached worlds in tests/worlds.py
    integration: boots a real Game and drives its states
    sweep: builds many seeds; statistical; run before a commit
addopts = -m "not sweep"
