; pygbag web-build packaging config. Read from the *current working directory*
; when `python -m pygbag` runs -- so build.sh and serve.sh in this folder `cd`
; here first and point pygbag at `../../main.py` (which stays at the repo root
; because pygbag packs the folder that contains the entry script).
;
; ignoreDirs entries are folder paths from the project root, leading slash
; included, and may be nested (`/assets/unused`). pygbag's own built-in list
; already covers /.git, /.github, /build and /dist; they are repeated here so
; this file reads as the complete exclusion list. Dot-files (.gitignore,
; .coverage, .coveragerc) and *.pyc are skipped by pygbag itself.
; ignoreFiles entries are bare basenames, matched at any depth.
;
; This is a deny-list, unlike the desktop spec's allow-list: a new top-level
; folder that the game does not load must be added here or it ships.
;
; The same goes for `unused/` folders, which is this project's name for
; "source files kept for reference after the shipped version was cut from
; them". The desktop spec skips that name at *any* depth; pygbag matches
; whole paths, so each one has to be listed (the five nested ones below were
; shipping until BLD-004, 0.8 MB). `tests/systems/test_web_audio.py`
; fails when an `unused/` folder in `assets/` is not covered here.
;
; The web release has no audio (owner, 2026-09-30, BLD-004): the browser
; profile sets `config.AUDIO_ENABLED = False`, so no cue or track is ever
; loaded, and `/assets/music` and `/assets/sound_effects` (with its `unused/`
; originals) stay out of the bundle. That also keeps pygbag's sound-format
; check quiet: it refuses MP3, WAV and AIFF with no OGG beside them, which
; is both the music and the recorded cues (they ship only on the desktop).
; `tests/systems/test_web_audio.py` checks every audio file the game names
; sits under one of these folders.
[DEPENDENCIES]
ignoreDirs = ["/.venv", "/.git", "/.github", "/.claude", "/.pytest_cache", "/.ruff_cache", "/tests", "/documentation", "/tools", "/utilities", "/build", "/dist", "/assets/unused", "/assets/effects/spawn/unused", "/assets/effects/status/unused", "/assets/effects/weapons/grave_totem/unused", "/assets/enemies/hex_shaman/unused", "/assets/ui/start_screen/unused", "/assets/music", "/assets/sound_effects", "/traces"]
ignoreFiles = ["save.json", "save.json.corrupt", "pytest.ini", "README.md", "FUNCTIONAL_README.md", "CLAUDE.md"]
