; pygbag web-build packaging config. Read from the *current working directory*
; when `python -m pygbag` runs -- so the build/serve helpers in this folder
; `cd` here first and point pygbag at `../main.py` (which stays at the repo root
; because pygbag packs the folder that contains the entry script).
;
; ignoreDirs entries are folder paths from the project root, leading slash
; included (pygbag's own IGNORE convention: /build, /venv, /.git, ...);
; ignoreFiles entries are bare basenames.
[DEPENDENCIES]
ignoreDirs = ["/.venv", "/.git", "/.github", "/.claude", "/.pytest_cache", "/tests", "/journals", "/documentation", "/utilities", "/build", "/web"]
ignoreFiles = ["save.json", "save.json.corrupt", "red", "death_must_die_lite_game_spec.md", "sprite_functionality.md"]
